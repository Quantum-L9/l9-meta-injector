[project]
name = "l9-node-typescript-addon"
version = "1.0.0"
description = "Deterministic Node.js and TypeScript repository profiling, audit providers, validator resolution and follow-up verification for the L9 agent trio."
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
l9-node-profile = "l9_node_ts.cli:profile_main"
l9-node-audit = "l9_node_ts.cli:audit_main"
l9-node-validator = "l9_node_ts.cli:validator_main"
l9-node-followup = "l9_node_ts.cli:followup_main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["l9_node_ts"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
