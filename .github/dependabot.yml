# Dependabot groups npm updates so that one maintainer-run report rebind lands a
# whole group (ADR-056). Every branch Dependabot opens changes package-lock.json,
# which moves the tree digest CURRENT_VALIDATION_REPORT.md is bound to; a bot
# cannot regenerate that report, so fewer, larger branches cost fewer rebinds.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    # Both version-update groups take minor and patch updates only, so a major
    # version of anything arrives as its own individual pull request and is
    # decided on its own (ADR-056 amendment). The first grouped branch (#108)
    # showed why: it put typescript 7 beside typescript-eslint 8, whose peer
    # range stops at 5.x, so `npm ci` failed on ERESOLVE before any check ran,
    # and the minor and patch updates sharing that branch could not land either.
    groups:
      # The test and build toolchain moves together: vitest pins vite, and the
      # TypeScript/ESLint pair is validated as one gate.
      dev-tooling:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "vitest"
          - "@vitest/*"
          - "vite"
          - "typescript"
          - "eslint"
          - "typescript-eslint"
          - "@types/node"
      # Everything else is transitive to the toolchain above; this package
      # declares no runtime dependencies. Minor and patch only as well, so the
      # wildcard does not recapture a major the group above left out.
      transitive:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      # Security updates arrive as one branch too, so one rebind closes them.
      security:
        applies-to: security-updates
        patterns:
          - "*"
