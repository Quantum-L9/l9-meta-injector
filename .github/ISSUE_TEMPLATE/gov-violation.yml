name: Governance Violation
description: Report a violation of CANONICAL_LAW.md policy
title: "[Gov Violation]: "
labels: ["type:bug", "area:governance", "needs:triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Use this template to report a detected violation of [CANONICAL_LAW.md](https://github.com/Quantum-L9/Cursor-Governance/blob/main/CANONICAL_LAW.md).
        The platform team will triage and enforce. Do NOT use this for general bugs — use the Bug Report template.

  - type: dropdown
    id: violation-type
    attributes:
      label: Violation Type
      options:
        - IDE adapter / symlink drift (§2 — links missing or broken)
        - Repository wiring failure (§6 — workspace config broken)
        - Anti-pattern detected (§7 — forbidden patterns present)
        - Policy gate failure (§10 / §12 — gate not enforcing policy)
        - Floating workflow or action ref (@main, a moving tag, @latest instead of a full SHA)
        - Other (describe below)
    validations:
      required: true

  - type: dropdown
    id: canonical-law-section
    attributes:
      label: CANONICAL_LAW.md Section Violated
      options:
        - "§1 — Single Source of Truth"
        - "§2 — IDE Adapter Model"
        - "§3 — User-Level Configuration"
        - "§4 — Naming Conventions"
        - "§5 — GitHub SSOT"
        - "§6 — Repository Wiring (incl. §6.1 / §6.2 autonomy)"
        - "§7 — Anti-Patterns"
        - "§8 — Memory Layer"
        - "§9 — Intelligence & Signal Mining"
        - "§10 — Governance Enforcement"
        - "§11 — Diagnose-First Execution Discipline"
        - "§12 — Mandatory Pre-PR Local Gate"
        - "§13 — Integration Branch & Local Runtime Discipline"
        - "§14 — GitHub PAT Authority"
        - "A dated amendment (name it under Evidence)"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Paste command output, diff, or log that demonstrates the violation.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: affected-repos
    attributes:
      label: Affected Repository
      multiple: true
      options:
        - l9-ci-core
        - Cursor-Governance
        - l9-assurance
        - .github (org backbone)
        - Multiple repos
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (active governance bypass / security impact)
        - High (CI not enforcing policy)
        - Medium (drift detected but not exploited)
        - Low (documentation only)
    validations:
      required: true

  - type: textarea
    id: proposed-fix
    attributes:
      label: Proposed Fix (optional)
      description: If you know how to fix this, describe the resolution.
