# Quantum-L9 org-wide issue template chooser config.
# https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository
#
# Advisory URL is rewritten per consumer by ops/build-seed-payload.js
# (same SSOT as SECURITY.md). Do not add a fourth security URL.

blank_issues_enabled: false

contact_links:
  - name: Security Vulnerability Report
    url: https://github.com/Quantum-L9/l9-meta-injector/security/advisories/new
    about: Do not open a public issue for security vulnerabilities. Follow SECURITY.md instead.
  - name: Governance / CANONICAL_LAW Question
    url: https://github.com/Quantum-L9/Cursor-Governance/blob/main/CANONICAL_LAW.md
    about: For questions about governance policy, symlink contracts, or CANONICAL_LAW.md, read the policy source of truth first.
  - name: Canonical CI
    url: https://github.com/Quantum-L9/l9-ci-core/blob/main/.github/workflows/org-ci.yml
    about: CI runs from l9-ci-core .github/workflows/org-ci.yml. This repository does not copy that workflow.
