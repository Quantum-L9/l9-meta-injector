name: PR 89 deterministic closure

on:
  push:
    branches:
      - agent/claude-code/main-convergence-v1

permissions:
  contents: write

concurrency:
  group: pr89-deterministic-closure
  cancel-in-progress: false

jobs:
  close:
    if: github.repository == 'Quantum-L9/l9-meta-injector'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Build, validate, bind evidence, and push the final tree
        shell: bash
        run: |
          set -euo pipefail

          # Remove the temporary byte-emission probe and this one-shot workflow
          # before calculating the validation digest. Neither belongs in the
          # final PR tree.
          rm -f tests/pr89_dist_generation_probe.test.ts
          rm -f .github/workflows/pr89-closure.yml

          npm run build
          npm run validate:report

          git add -A
          if git diff --cached --quiet; then
            echo "PR 89 closure produced no commit" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: close PR 89 with generated dist and bound validation evidence"
          git push origin HEAD:refs/heads/agent/claude-code/main-convergence-v1
