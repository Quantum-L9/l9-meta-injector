# --- L9_META ---
# l9_schema: 1
# origin: l9-meta-injector
# layer: [ci, assurance]
# tags: [topology, conformance, consumer, packet]
# owner: platform
# status: active
# --- /L9_META ---
#
# Proves, on every pull request and push to main, that the committed Repository
# Model Packet bundles are still accepted by the real l9-constellation-topology
# consumer, and that a packet this producer emits over its own tree compiles there
# with a passing validation receipt. docs/topology-conformance.json names the
# consumer revision the record was bound to; the weekly run checks the consumer's
# main instead, so drift in the consumer is visible before a release pins it.
#
# This workflow reads the consumer and never writes to it. It adds no copied or
# delegating organization workflow and pins no Core or SDK revision (ADR-048).
name: Topology conformance

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:17 UTC, against the consumer's main rather than the pinned record.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The consumer is always checked out at a static ref (its default branch) and
      # pinned afterwards by a plain git command: the checkout ref never comes from
      # a step output, and this job writes no Actions cache, so a scheduled run on
      # the default branch cannot poison a cache from the consumer's code (CodeQL
      # actions/cache-poisoning/poisonable-step).
      - name: Check out the consumer, read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Quantum-L9/l9-constellation-topology
          ref: main
          fetch-depth: 0
          path: .l9-topology-consumer
          persist-credentials: false

      - name: Pin the consumer to the revision this record binds to
        id: consumer
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            # Drift watch: stay on the consumer's main so a consumer rule change
            # shows up here before a release pins it.
            echo "mode=drift-watch" >> "$GITHUB_OUTPUT"
          else
            rev="$(node -p "require('./docs/topology-conformance.json').consumer.revision")"
            if [[ ! "$rev" =~ ^[0-9a-f]{40}$ ]]; then
              echo "docs/topology-conformance.json does not name a 40-hex consumer revision: $rev" >&2
              exit 1
            fi
            git -C .l9-topology-consumer switch --detach "$rev"
            echo "mode=record" >> "$GITHUB_OUTPUT"
          fi
          echo "consumer=$(git -C .l9-topology-consumer rev-parse HEAD)"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Install the consumer into a scratch interpreter
        shell: bash
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/topology-venv"
          "$RUNNER_TEMP/topology-venv/bin/python" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/topology-venv/bin/python" -m pip install --quiet "$GITHUB_WORKSPACE/.l9-topology-consumer"
          "$RUNNER_TEMP/topology-venv/bin/python" -c "import l9_constellation_topology"

      - name: Golden bundles are accepted by the consumer and the record matches them
        shell: bash
        env:
          L9_TOPOLOGY_CHECKOUT: ${{ github.workspace }}/.l9-topology-consumer
          L9_PYTHON: ${{ runner.temp }}/topology-venv/bin/python
          CONFORMANCE_MODE: ${{ steps.consumer.outputs.mode }}
        run: |
          echo "mode=$CONFORMANCE_MODE consumer=$(git -C "$L9_TOPOLOGY_CHECKOUT" rev-parse HEAD)"
          node scripts/topology-conformance.js

      - name: A real packet of this repository compiles in the consumer
        shell: bash
        env:
          TOPOLOGY_BIN: ${{ runner.temp }}/topology-venv/bin/l9-topology
        run: |
          out="$RUNNER_TEMP/self-source"
          node scripts/local-source-cli.js . \
            --name l9-meta-injector \
            --out "$out" \
            --omit ".git/" \
            --omit "node_modules/" \
            --omit ".l9-topology-consumer/" \
            --omit "dist/" \
            --omit "coverage/" \
            --omit "fixtures/"
          # The consumer compiles under its own topology profile; this repository
          # declares none and must not grow one for a conformance probe.
          "$TOPOLOGY_BIN" compile-packet \
            --repo-root "$GITHUB_WORKSPACE/.l9-topology-consumer" \
            --input-bundle "$out/bundle" \
            --out "$RUNNER_TEMP/self-topology" > "$RUNNER_TEMP/compile.json"
          status="$(node -p "require('$RUNNER_TEMP/compile.json').validation_status")"
          echo "consumer validation_status=$status"
          if [[ "$status" != "passed" ]]; then
            node -p "JSON.stringify(require('$RUNNER_TEMP/self-topology/receipts/validation-receipt.json'), null, 2)"
            exit 1
          fi
